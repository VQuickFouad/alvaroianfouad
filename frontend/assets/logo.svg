<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="1" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.8" />
    </linearGradient>
    <linearGradient id="shieldGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#00d4ff" stop-opacity="0.02" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Shield Glow -->
  <path d="M 50 8
           C 68 8, 86 16, 86 34
           C 86 64, 50 90, 50 90
           C 50 90, 14 64, 14 34
           C 14 16, 32 8, 50 8 Z"
        fill="url(#shieldGlow)"
        stroke="url(#shieldGrad)"
        stroke-width="3"
        stroke-linejoin="round"
        filter="url(#neonGlow)" />

  <!-- Inner Shield Subtle Border -->
  <path d="M 50 16
           C 64 16, 78 22, 78 36
           C 78 60, 50 81, 50 81
           C 50 81, 22 60, 22 36
           C 22 22, 36 16, 50 16 Z"
        fill="none"
        stroke="#00d4ff"
        stroke-width="1.2"
        stroke-dasharray="3 3"
        opacity="0.5" />

  <!-- Gear / Cog inside Shield -->
  <g transform="translate(50, 47)" fill="#00d4ff" stroke="#0a0e17" stroke-width="1.5">
    <!-- Gear teeth: 8 teeth created via rotated rects -->
    <rect x="-4" y="-22" width="8" height="44" rx="2" />
    <rect x="-4" y="-22" width="8" height="44" rx="2" transform="rotate(45)" />
    <rect x="-4" y="-22" width="8" height="44" rx="2" transform="rotate(90)" />
    <rect x="-4" y="-22" width="8" height="44" rx="2" transform="rotate(135)" />

    <!-- Gear Body Circle -->
    <circle cx="0" cy="0" r="16" fill="url(#shieldGrad)" stroke="#0a0e17" stroke-width="2" />

    <!-- Gear Center Hole -->
    <circle cx="0" cy="0" r="7" fill="#0a0e17" stroke="#00d4ff" stroke-width="2" />

    <!-- Core Dot -->
    <circle cx="0" cy="0" r="2.5" fill="#00d4ff" />
  </g>

  <!-- Accent Tech Circuit Dots -->
  <circle cx="50" cy="22" r="2" fill="#00d4ff" />
  <line x1="50" y1="22" x2="50" y2="25" stroke="#00d4ff" stroke-width="1.5" />
  <circle cx="50" cy="71" r="2" fill="#00d4ff" />
  <line x1="50" y1="69" x2="50" y2="71" stroke="#00d4ff" stroke-width="1.5" />
</svg>
