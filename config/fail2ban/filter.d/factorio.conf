# ==============================================================================
# Factorio Tech Solutions - Filtro personalizado de Fail2ban
# Ubicación habitual: /etc/fail2ban/filter.d/factorio.conf
# ==============================================================================

[INCLUDES]
before = common.conf

[Definition]
_daemon = factorio

# Expresiones regulares para capturar intentos de autenticación fallidos o accesos no autorizados
# Ejemplos esperados en los logs de la aplicación:
# 2026-10-14 12:00:00 [WARNING] factorio.auth: Autenticación fallida para el usuario 'admin' desde 192.168.1.100
# 2026-10-14 12:00:00 [WARNING] factorio.security: Acceso no autorizado o token invalido desde 192.168.1.100
# 2026-10-14 12:00:00 [WARNING] factorio.api: Peticion sospechosa o ataque detectado desde 192.168.1.100

failregex = ^.*\[WARNING\].*Autenticación fallida.*desde <HOST>.*$
            ^.*\[WARNING\].*Acceso no autorizado.*desde <HOST>.*$
            ^.*\[WARNING\].*Peticion sospechosa.*desde <HOST>.*$
            ^.*\[WARNING\].*Login failed for user .* from <HOST>.*$
            ^.*\[WARNING\].*Invalid authentication credentials from <HOST>.*$

# Líneas a ignorar explícitamente
ignoreregex =
