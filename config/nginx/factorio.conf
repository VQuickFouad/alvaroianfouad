# ==============================================================================
# Factorio Tech Solutions - Configuración de Virtual Host Nginx
# Ubicación habitual: /etc/nginx/sites-available/factorio.conf
# Enlace simbólico: /etc/nginx/sites-enabled/factorio.conf
# ==============================================================================

# Este archivo se incluye desde el contexto http{} de nginx.conf.
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=general_limit:10m rate=10r/s;

# Definición del grupo Upstream para la aplicación Factorio
upstream factorio_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

# Redirección global de HTTP (Puerto 80) a HTTPS (Puerto 443)
server {
    listen 80;
    listen [::]:80;
    server_name factorio.empresa.local; # Reemplazar con el FQDN corporativo

    # Ruta de validación para renovación de certificados Let's Encrypt / Certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Redireccionar el resto de solicitudes a HTTPS permanentemente (301)
    location / {
        return 301 https://$host$request_uri;
    }
}

# Servidor Seguro HTTPS (Puerto 443)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name factorio.empresa.local; # Reemplazar con el FQDN corporativo

    # Certificados SSL/TLS (Rutas configuradas por Certbot o autofirmados para laboratorio)
    ssl_certificate /etc/ssl/certs/factorio-selfsigned.crt;
    ssl_certificate_key /etc/ssl/private/factorio-selfsigned.key;

    # Protocolos y Cifrados Seguros (TLSv1.2 y TLSv1.3)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;

    # Optimización de Sesiones SSL
    ssl_session_cache shared:FactorioSSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Inclusión de Cabeceras de Seguridad HTTP
    include /etc/nginx/snippets/security-headers.conf;

    # Ocultar versión del servidor en respuestas
    server_tokens off;

    # Límites de tamaño de cuerpo de petición
    client_max_body_size 16M;

    # Registros específicos para el sitio
    access_log /var/log/nginx/factorio_access.log combined;
    error_log /var/log/nginx/factorio_error.log warn;

    # Denegar acceso a archivos y directorios ocultos (.git, .env, .sqlite)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Denegar acceso directo a bases de datos o backups
    location ~* \.(sqlite|db|dump|sql|bak|backup)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Limitación estricta de tasa para endpoints de autenticación y login
    location /api/auth/ {
        limit_req zone=login_limit burst=5 nodelay;

        proxy_pass http://factorio_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy inverso principal hacia el backend de Factorio Tech Solutions
    location / {
        limit_req zone=general_limit burst=20 nodelay;

        proxy_pass http://factorio_backend;
        proxy_http_version 1.1;

        # Soporte para WebSockets y conexiones persistentes
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Propagación de cabeceras de cliente reales
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Tiempos de espera de conexión con el backend
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
