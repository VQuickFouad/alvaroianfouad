# ==============================================================================
# Factorio Tech Solutions - Cabeceras de Seguridad HTTP (OWASP Recommended)
# Ubicación habitual: /etc/nginx/snippets/security-headers.conf
# ==============================================================================

# 1. HSTS (HTTP Strict Transport Security)
# Obliga a los clientes a usar conexiones HTTPS durante 1 año, incluyendo subdominios.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

# 2. X-Frame-Options
# Impide que el sitio sea incrustado en frames/iframes, mitigando ataques de Clickjacking.
add_header X-Frame-Options "DENY" always;

# 3. X-Content-Type-Options
# Impide la adivinación o interpretación errónea del tipo MIME (MIME Sniffing).
add_header X-Content-Type-Options "nosniff" always;

# 4. Referrer-Policy
# Controla la cantidad de información de referencia que se envía al navegar fuera del sitio.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# 5. Permissions-Policy (anteriormente Feature-Policy)
# Restringe el acceso a APIs y funciones sensibles del navegador del cliente.
add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=(), usb=(), vr=()" always;

# 6. Content-Security-Policy (CSP)
# Mitiga inyección de código y XSS restringiendo los orígenes de carga de recursos.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;

# 7. X-XSS-Protection (Compatibilidad con navegadores antiguos)
add_header X-XSS-Protection "1; mode=block" always;
